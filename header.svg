<svg fill="none" viewBox="0 0 750 70" width="100%" height="70" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          display: flex;
          align-items: baseline;
          background: transparent;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          padding-top: 10px;
        }

        .prefix {
          font-size: 32px;
          font-weight: 400;
          color: #94a3b8;
          margin-right: 12px;
          white-space: nowrap;
        }

        .cycle-wrapper {
          position: relative;
          display: inline-block;
          height: 48px;
        }

        .phrase {
          position: absolute;
          left: 0;
          top: 0;
          white-space: nowrap;
          opacity: 0;
          display: inline-block;
        }

        .phrase-text {
          font-size: 34px;
          font-weight: 800;
          color: #ffffff;
          letter-spacing: -0.5px;
        }

        .underline {
          height: 4px;
          margin-top: 2px;
          background: #2563eb;
          border-radius: 2px;
          box-shadow: 0 0 8px #2563eb;
        }

        /* 9s total loop (3s each) */
        .phrase-1 { animation: cycle1 9s infinite ease-in-out; }
        .phrase-2 { animation: cycle2 9s infinite ease-in-out; }
        .phrase-3 { animation: cycle3 9s infinite ease-in-out; }

        @keyframes cycle1 {
          0% { opacity: 0; transform: translateY(8px); }
          5% { opacity: 1; transform: translateY(0); }
          28% { opacity: 1; transform: translateY(0); }
          33% { opacity: 0; transform: translateY(-8px); }
          100% { opacity: 0; }
        }

        @keyframes cycle2 {
          0%, 33% { opacity: 0; transform: translateY(8px); }
          38% { opacity: 1; transform: translateY(0); }
          61% { opacity: 1; transform: translateY(0); }
          66% { opacity: 0; transform: translateY(-8px); }
          100% { opacity: 0; }
        }

        @keyframes cycle3 {
          0%, 66% { opacity: 0; transform: translateY(8px); }
          71% { opacity: 1; transform: translateY(0); }
          95% { opacity: 1; transform: translateY(0); }
          100% { opacity: 0; transform: translateY(-8px); }
        }
      </style>

      <div class="container">
        <span class="prefix">I build</span>
        <div class="cycle-wrapper">
          <div class="phrase phrase-1">
            <span class="phrase-text">AI &amp; ML Systems.</span>
            <div class="underline"></div>
          </div>
          <div class="phrase phrase-2">
            <span class="phrase-text">Real-World Solutions.</span>
            <div class="underline"></div>
          </div>
          <div class="phrase phrase-3">
            <span class="phrase-text">Full-Stack Applications.</span>
            <div class="underline"></div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
