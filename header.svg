<svg fill="none" viewBox="0 0 800 120" width="100%" height="120" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .wrapper {
          display: flex;
          align-items: center;
          height: 120px;
          background: #020617;
          border-radius: 12px;
          padding: 0 32px;
          box-sizing: border-box;
          border: 1px solid rgba(255, 255, 255, 0.08);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .icon {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          margin-right: 18px;
          color: #38bdf8;
        }

        .prefix {
          font-size: 32px;
          font-weight: 300;
          color: #94a3b8;
          letter-spacing: -0.5px;
          margin-right: 12px;
        }

        .highlight-container {
          position: relative;
          display: inline-block;
        }

        .highlight-text {
          font-size: 34px;
          font-weight: 800;
          color: #ffffff;
          letter-spacing: -0.5px;
        }

        .underline {
          position: absolute;
          bottom: -4px;
          left: 0;
          width: 100%;
          height: 4px;
          background: linear-gradient(90deg, #1d4ed8, #2563eb, #38bdf8);
          border-radius: 2px;
          box-shadow: 0 2px 10px rgba(37, 99, 235, 0.5);
        }

        @media (max-width: 600px) {
          .prefix { font-size: 22px; }
          .highlight-text { font-size: 24px; }
          .wrapper { padding: 0 16px; height: 90px; }
        }
      </style>

      <div class="wrapper">
        <div class="icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
        <span class="prefix">I build</span>
        <div class="highlight-container">
          <span class="highlight-text">AI &amp; ML Systems.</span>
          <div class="underline"></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
